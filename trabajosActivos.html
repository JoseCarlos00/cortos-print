<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="public/CSS/preloader.css">

  <link rel="stylesheet" href="public/CSS/style.css">
  <link rel="stylesheet" href="public/CSS/tablas.css">
  <link rel="stylesheet" href="public/CSS/trabajosActivos.css">

  <link rel="shortcut icon" href="public/images/favicon.png" type="image/x-icon">

  <script type="module" src="./src/components/index.js"></script>

  <title>Trabajos Activos</title>
</head>

<body>
  <my-preloader></my-preloader>

  <header>
    <my-navbar active="Cortos"></my-navbar>
  </header>

  <section class="filters">
    <form>
      <fieldset>
        <legend>Ordenar por</legend>
        <label>
          <input type="radio" name="ordenar" value="ID DEL PEDIDO">
          ID DEL PEDIDO
        </label>

        <label>
          <input type="radio" name="ordenar" value="SHIP_TO" checked>
          SHIP_TO <span style="font-size: 10px;">(Cliente)</span>
        </label>

        <label>
          <input type="radio" name="ordenar" value="NoOrdenar">
          No Ordenar
        </label>
      </fieldset>
    </form>

    <button id="toggleButton" class="btn-ver-mas" disabled>
      <span>
        <svg class="toggleIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
          stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
          <path d="M12 19v-7m0 0V5m0 7H5m7 0h7"></path>
        </svg>
        Mostrar Columnas
      </span>
    </button>

    <div id="checkboxContainer"></div>
  </section>


  <my-file-upload></my-file-upload>

  <main>
    <my-loading-container></my-loading-container>
    <div id="tablePreview" style="display: none;"></div>
  </main>
  
  <my-back-to-top></my-back-to-top>

  <footer></footer>


  <script type="module" src="./trabajosActivos.js"></script>
  <script type="module" src="./xlsx.full.min.js"></script>
</body>

</html>
